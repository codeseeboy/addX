# Release APK with embedded JS bundle (Expo export:embed). Debug builds skip bundling and need Metro — that caused "Unable to load script".
# Artifact: addX → addX.apk. Icons from app.json / assets/.
#
# Runs on: push to main (matching paths), any PR into main (path filter), or manual run.
#
# Required repository secrets:
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY
# Fork PRs: secrets are not passed — workflow will fail until you use a branch on this repo.

name: Android APK (artifact)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'babel.config.js'
      - 'index.js'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'babel.config.js'
      - 'index.js'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: prebuild + assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx2g
      EXPO_PUBLIC_API_BASE_URL: https://addx.onrender.com/api
      EXPO_PUBLIC_AUTH_BRIDGE_URL: https://addx.onrender.com
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate Supabase secrets
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo '::error::Add Actions secrets EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions). Fork PRs cannot use repo secrets.'
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project (Expo prebuild)
        run: npx expo prebuild --platform android

      # Default Gradle template signs release with signingConfigs.debug; store file may be missing on CI.
      - name: Ensure android/app/debug.keystore
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v -noprompt \
              -keystore android/app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK (embeds JS; works offline)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Package addX.apk for artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk addX.apk

      - uses: actions/upload-artifact@v4
        with:
          name: addX
          path: addX.apk
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        run: |
          PR="${{ github.event.pull_request.number }}"
          {
            echo '### addX Android APK'
            echo ''
            echo 'Artifact **addX** (ZIP) contains **addX.apk** (release build, JS embedded; works without Metro). Icons from \`app.json\` / \`assets/\`.'
            echo ''
            if [ -n "$PR" ]; then echo "PR: #$PR"; echo ''; fi
            echo 'Install: Actions → this run → Artifacts → **addX** → unzip → \`adb install -r addX.apk\`'
          } >> "$GITHUB_STEP_SUMMARY"
