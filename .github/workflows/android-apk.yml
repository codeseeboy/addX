# Builds a debug APK with production API URLs (Render) and uploads it as a workflow artifact.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   EXPO_PUBLIC_SUPABASE_URL
#   EXPO_PUBLIC_SUPABASE_ANON_KEY
#
# API base + auth bridge are set below (same as eas.json production). LLM stays on the Node backend only.

name: Android APK (artifact)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'babel.config.js'
      - 'index.js'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: prebuild + assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx2g
      EXPO_PUBLIC_API_BASE_URL: https://addx.onrender.com/api
      EXPO_PUBLIC_AUTH_BRIDGE_URL: https://addx.onrender.com
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate Supabase secrets
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo '::error::Add Actions secrets EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions).'
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project (Expo prebuild)
        run: npx expo prebuild --platform android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK (clear filename in artifact)
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "addx-debug-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: addx-android-debug-${{ github.run_number }}
          path: addx-debug-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        run: |
          {
            echo '### AddX Android APK'
            echo ''
            echo 'Artifact **addx-android-debug-${{ github.run_number }}** contains \`addx-debug-${{ github.run_number }}.apk\` (debug-signed; API → Render production).'
            echo ''
            echo 'Install: download the artifact ZIP from this run, unzip, then \`adb install -r addx-debug-${{ github.run_number }}.apk\`.'
            echo ''
            echo 'For a **release**-signed APK (Play Store), use EAS Build or add signing steps to this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
